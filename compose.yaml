services:
  mcp:
    build: .
    image: wechat-assistant-mcp:local
    ports:
      - "127.0.0.1:18767:8080"
    env_file:
      - .env.docker
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
